services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mortgageflow
      POSTGRES_USER: mortgageflow
      POSTGRES_PASSWORD: local_demo_only
    ports:
      - "5432:5432"
    volumes:
      - mortgageflow_postgres:/var/lib/postgresql/data
volumes:
  mortgageflow_postgres:
